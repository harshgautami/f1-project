<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="F1 login background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="55%" stop-color="#131d30"/>
      <stop offset="100%" stop-color="#3a0f17"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2e2e" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ff2e2e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff8a00" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.45">
    <circle cx="170" cy="150" r="220" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="1420" cy="740" r="280" fill="#ffffff" fill-opacity="0.03"/>
  </g>
  <g>
    <rect x="-100" y="320" width="1900" height="28" transform="rotate(-12 800 450)" fill="url(#stripe)"/>
    <rect x="-140" y="390" width="1900" height="12" transform="rotate(-12 800 450)" fill="#ffffff" fill-opacity="0.08"/>
  </g>
</svg>
